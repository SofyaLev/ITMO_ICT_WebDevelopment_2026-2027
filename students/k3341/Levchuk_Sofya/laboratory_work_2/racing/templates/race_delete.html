{% extends 'base.html' %}

{% block title %}Удаление гонки{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="card-title mb-3">Удалить гонку?</h1>
                    <p>Вы уверены, что хотите удалить <strong>{{ race.name }}</strong>?</p>
                    <p class="text-muted small">Все регистрации и комментарии к этой гонке тоже будут удалены.</p>

                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                        <a href="{% url 'race_detail' race.id %}" class="btn btn-link">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
