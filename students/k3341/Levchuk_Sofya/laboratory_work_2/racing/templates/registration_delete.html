{% extends 'base.html' %}

{% block title %}Удаление регистрации{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="card-title mb-3">Удалить регистрацию?</h1>
                    <p>Вы уверены, что хотите удалить регистрацию на гонку
                        <strong>{{ registration.race.name }}</strong>?</p>

                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                        <a href="{% url 'my_registrations' %}" class="btn btn-link">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
