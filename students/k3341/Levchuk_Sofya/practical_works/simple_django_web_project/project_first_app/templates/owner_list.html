<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Список владельцев</title>
</head>
<body>
    <h1>Все автовладельцы</h1>

    <p>
        <a href="{% url 'owner_create' %}">+ Добавить владельца</a> |
        <a href="{% url 'register' %}">Регистрация</a>
    </p>

    <ul>
        {% for owner in owners %}
            <li>
                <a href="{% url 'owner_detail' owner.id %}">
                    {{ owner.last_name }} {{ owner.first_name }}
                </a>
                ({{ owner.username }})
                — гражданство: {{ owner.nationality|default:"не указано" }}
            </li>
        {% empty %}
            <li>Владельцев пока нет.</li>
        {% endfor %}
    </ul>
</body>
</html>
